[project]
name = "tradingbot"
version = "0.1.0"
description = "Automatisierter Trading Bot (Paper Trading zuerst) fuer Gold, Silber, NQ und ES"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyyaml>=6.0", "yfinance>=0.2.40"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
