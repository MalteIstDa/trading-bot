# Copy-Trading der besten Hyperliquid-Trader (nur Paper Trading).
# Nutzung: tradingbot traders scan|test|watch --config config/hyperliquid.yaml
mode: paper
markets: []            # Coins ergeben sich aus den Positionen der kopierten Trader

account:
  start_capital: 20.0  # dein Budget
  fee_per_trade: 0.0
  fee_pct: 0.045       # Hyperliquid Taker-Gebuehr pro Seite
  slippage_ticks: 0

risk:
  risk_per_trade_pct: 2.0
  reward_risk: 3.0     # SL/TP setzt unser Bot, nicht der Trader (RR 1:3)
  atr_period: 14
  sl_atr_mult: 1.5
  max_daily_loss_pct: 6.0
  max_open_positions: 2
  exit_mode: fixed
  trail_atr_mult: 3.0
