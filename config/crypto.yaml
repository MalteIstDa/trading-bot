# Krypto-Konfiguration. Nutzung: tradingbot select --config config/crypto.yaml --timeframe 1h
# Krypto wird rund um die Uhr gehandelt, und man kann Bruchteile kaufen (z. B. 0.0003 BTC).
mode: paper

markets:               # Yahoo-Finance-Symbole, Preise in USD
  - {symbol: "BTC-USD", name: "Bitcoin",  point_value: 1.0, lot_step: 0.00001}
  - {symbol: "ETH-USD", name: "Ethereum", point_value: 1.0, lot_step: 0.0001}
  - {symbol: "SOL-USD", name: "Solana",   point_value: 1.0, lot_step: 0.01}

timeframe: "1h"
history_period: "730d"

account:
  start_capital: 20.0      # dein echtes Budget, damit der Test realistisch ist
  fee_per_trade: 0.0
  fee_pct: 0.1             # typische Boersengebuehr: 0,1 % pro Kauf und pro Verkauf
  slippage_ticks: 0

risk:
  risk_per_trade_pct: 2.0  # 2 % von 20 = 0,40 pro Trade
  reward_risk: 3.0
  atr_period: 14
  sl_atr_mult: 1.5
  max_daily_loss_pct: 6.0
  max_open_positions: 3
  exit_mode: fixed
  trail_atr_mult: 3.0

selection:
  train_bars: 2000
  test_bars: 500
  min_trades: 30
  min_profit_factor: 1.2
  min_win_rate: 0.0
