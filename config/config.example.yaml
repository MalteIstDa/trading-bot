# Kopieren nach config/config.yaml und anpassen.
mode: paper            # paper | live  (live ist absichtlich noch nicht implementiert)

markets:               # Yahoo-Finance-Symbole (kostenlos, fuer Backtest und Paper Trading)
  - {symbol: "GC=F", name: "Gold",        point_value: 10.0}   # Micro Gold (MGC) = 10 USD pro Punkt
  - {symbol: "SI=F", name: "Silber",      point_value: 1000.0} # Micro Silver (SIL) = 1000 USD pro 1 USD
  - {symbol: "NQ=F", name: "Nasdaq 100",  point_value: 2.0}    # Micro NQ (MNQ) = 2 USD pro Punkt
  - {symbol: "ES=F", name: "S&P 500",     point_value: 5.0}    # Micro ES (MES) = 5 USD pro Punkt

timeframe: "5m"        # schnelles Trading; Yahoo liefert 5m-Daten nur fuer die letzten 60 Tage
history_period: "60d"

account:
  start_capital: 10000.0   # Paper-Kapital (Spielgeld)
  fee_per_trade: 1.0       # Gebuehr pro Seite in Kontowaehrung
  slippage_ticks: 1

risk:
  risk_per_trade_pct: 1.0  # max. 1 % des Kontos pro Trade
  reward_risk: 3.0         # TP = 3 x SL-Abstand  (RR 1:3)
  atr_period: 14
  sl_atr_mult: 1.5         # SL-Abstand = 1.5 x ATR
  max_daily_loss_pct: 3.0  # danach stoppt der Bot fuer den Tag
  max_open_positions: 2

selection:                 # automatische Strategie-Auswahl (Walk-Forward)
  train_bars: 2000
  test_bars: 500
  min_trades: 30
  min_profit_factor: 1.2
  min_win_rate: 0.0        # bei RR 1:3 reicht rechnerisch > 25 %; siehe README
